version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: employee_management
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: mysql+pymysql://root:example@db:3306/employee_management
      DEBUG: 'False'
    depends_on:
      - db
    volumes:
      - ./:/app

volumes:
  db_data:
